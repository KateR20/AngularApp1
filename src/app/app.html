
<!-- Main User Profile Dashboard -->
<main class="dashboard">

  <header class="dashboard-header">
    <h1>My Profile Dashboard</h1>
    <p>Welcome to your personal space!</p>
  </header>

  <section class="dashboard-content">

    <!-- User information -->
    <app-user-card [user]="user()"></app-user-card>
    <!-- Online/offline status -->
    
<app-user-status
  [isOnline]="user().isOnline"
  (statusChange)="updateStatus($event)">
</app-user-status>

    <!-- Editable biography -->
    
<app-user-bio
  [bio]="user().bio"
  (bioChange)="updateBio($event)">
</app-user-bio>

  </section>

</main>
